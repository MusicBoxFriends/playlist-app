<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1C2433">
<meta name="mobile-web-app-capable" content="yes">
<title>Playlist Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C2433'/%3E%3Crect x='12' y='40' width='40' height='6' rx='3' fill='%232F5DA8'/%3E%3Crect x='12' y='40' width='12' height='6' rx='3' fill='%23D6333F'/%3E%3Cpath d='M26 16v18l14-9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF2F6; --surface: #FFFFFF; --ink: #1C2433; --muted: #5F6B7E; --line: #D5DCE6;
    --blue: #2F5DA8; --red: #D6333F; --blue-soft: #DCE6F5; --red-soft: #F7DDE0; --empty: #E3E8EF;
    --deck: #1C2433; --deck-ink: #F2F5F9; --deck-muted: #A9B4C6;
    --title: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --nav-h: 60px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161F; --surface: #1A212D; --ink: #E7EBF1; --muted: #9AA5B7; --line: #2A3342;
      --blue: #739BDD; --red: #EE6A74; --blue-soft: #22324D; --red-soft: #43242A; --empty: #283142;
      --deck: #0C1017;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body);
         padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ── the deck: player pinned at the top ── */
  .deck { position: sticky; top: 0; z-index: 34; background: var(--deck); color: var(--deck-ink);
          padding-top: env(safe-area-inset-top, 0px); box-shadow: 0 2px 12px rgba(0,0,0,.25); }
  .screen { position: relative; width: 100%; max-width: calc(45vh * 16 / 9); min-height: 200px; margin: 0 auto;
            aspect-ratio: 16 / 9; background: #000; }
  .screen > div, .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .now { display: flex; align-items: center; gap: 10px; padding: 8px 12px 6px; max-width: 900px; margin: 0 auto; }
  .now-text { flex: 1; min-width: 0; }
  .now-title { font: 600 1.15rem/1.2 var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-sub { font-size: .8rem; color: var(--deck-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
              border: 0; background: transparent; color: inherit; }
  .icon-btn svg { width: 24px; height: 24px; }
  .icon-btn.primary { background: var(--blue); color: #fff; }
  .deck .icon-btn:not(.primary):active { background: rgba(255,255,255,.12); }
  .progress { height: 3px; background: rgba(255,255,255,.15); max-width: 900px; margin: 0 auto; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .25s linear; }
  .deck.counted .progress > i { background: #7FA6E6; }
  .times { display: flex; justify-content: space-between; gap: 8px; font-size: .72rem; color: var(--deck-muted);
           padding: 3px 12px 7px; max-width: 900px; margin: 0 auto; font-variant-numeric: tabular-nums; }
  .times .hint { flex: 1; text-align: center; }

  /* ── pages ── */
  main { max-width: 900px; margin: 0 auto; padding: 16px 14px 24px; }
  h1 { font: 700 1.9rem/1.1 var(--title); margin: 4px 0 14px; letter-spacing: .005em; }
  h2 { font: 600 1.25rem/1.2 var(--title); margin: 26px 0 10px; }
  p.lead { margin: -6px 0 14px; color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
         padding: 0 18px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--surface);
         font-weight: 600; font-size: .95rem; text-decoration: none; color: var(--ink); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.danger { color: var(--red); border-color: var(--red); background: transparent; }
  .btn.quiet { border-color: transparent; background: transparent; padding: 0 10px; }
  .btn:disabled { opacity: .5; cursor: default; }
  label.field { display: block; margin: 0 0 12px; }
  label.field > span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=search], input[type=password], input[type=number], select, textarea {
    width: 100%; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--surface); }
  textarea { min-height: 120px; resize: vertical; }
  input[type=range] { width: 100%; accent-color: var(--blue); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; margin-bottom: 8px; }
  .switch input { width: 22px; height: 22px; accent-color: var(--blue); }
  .seg { display: flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .seg button { flex: 1; min-height: 42px; border: 0; background: transparent; font-size: .9rem; font-weight: 600; color: var(--muted); padding: 0 6px; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-pressed=true] { background: var(--blue); color: #fff; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }

  /* ── song lists: the jukebox strip is the signature ── */
  ul.songs { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  ul.songs > li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; min-height: 60px; border-top: 1px solid var(--line); }
  ul.songs > li:first-child { border-top: 0; }
  ul.songs > li.tap { cursor: pointer; }
  ul.songs > li.tap:active { background: var(--blue-soft); }
  ul.songs > li.current { background: var(--blue-soft); }
  .song-main { flex: 1; min-width: 0; }
  .song-title { font: 600 1.05rem/1.2 var(--title); overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
                -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .song-sub { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-side { flex: none; width: 64px; text-align: right; font-size: .78rem; font-variant-numeric: tabular-nums; }
  .strip { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--empty); margin: 4px 0 3px auto; width: 56px; }
  .strip > .p { background: var(--blue); }
  .strip > .s { background: var(--red); }
  .counts { color: var(--muted); }
  .counts b { font-weight: 600; }
  .counts .cp { color: var(--blue); }
  .counts .cs { color: var(--red); }
  .rank { flex: none; width: 26px; text-align: right; font: 600 .95rem var(--title); color: var(--muted); }
  .status { font-size: .75rem; font-weight: 600; color: var(--blue); margin-right: 8px; }
  .chance { font-size: .75rem; color: var(--muted); }
  .mini-btns { display: flex; gap: 2px; flex: none; }
  .mini-btns .icon-btn { width: 36px; height: 40px; border-radius: 8px; color: var(--muted); }
  .blocked { font-size: .72rem; color: var(--red); font-weight: 600; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }

  /* ── stats ── */
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 600px) { .metrics { grid-template-columns: repeat(4, 1fr); } }
  .metric { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .metric b { display: block; font: 700 1.9rem/1 var(--title); margin-bottom: 4px; }
  .metric span { font-size: .8rem; color: var(--muted); }
  .hbars { display: grid; gap: 8px; }
  .hbar-label { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; }
  .hbar-label span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 .95rem var(--title); }
  .hbar-track { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--empty); margin-top: 3px; }
  .hbar-track .p { background: var(--blue); } .hbar-track .s { background: var(--red); }
  .vbars { display: flex; align-items: flex-end; gap: 2px; height: 130px; padding-top: 6px; }
  .vbar { flex: 1; display: flex; flex-direction: column-reverse; min-width: 3px; height: 100%; }
  .vbar .p { background: var(--blue); } .vbar .s { background: var(--red); } .vbar .n { background: var(--blue); }
  .vaxis { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: 4px; }
  .legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chips button { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--surface); font-size: .85rem; font-weight: 600; color: var(--muted); }
  .chips button[aria-pressed=true] { border-color: var(--ink); color: var(--ink); }

  /* ── bottom navigation ── */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--surface);
             border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.tabs button { flex: 1; height: var(--nav-h); border: 0; background: transparent; display: flex; flex-direction: column;
                    align-items: center; justify-content: center; gap: 2px; font-size: .72rem; font-weight: 600; color: var(--muted); }
  nav.tabs svg { width: 24px; height: 24px; }
  nav.tabs button[aria-current=page] { color: var(--blue); }

  /* ── toast & dialogs ── */
  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
           z-index: 50; max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px;
           font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  /* dialogs sit UNDER the player (YouTube doesn't allow anything drawn over it) and open next to it */
  dialog { position: fixed; inset: auto; margin: 0; z-index: 32; border: 0; border-radius: 18px; padding: 0; width: min(94vw, 560px);
           max-height: 86vh; background: var(--surface); color: var(--ink); box-shadow: 0 12px 40px rgba(0, 0, 0, .3); }
  #veil { position: fixed; inset: 0; z-index: 31; background: rgba(10, 14, 22, .55); }
  .dlg { padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px; max-height: inherit; box-sizing: border-box; }
  .dlg h2 { margin: 0; }
  .dlg .scroll { overflow: auto; min-height: 0; flex: 1; border: 1px solid var(--line); border-radius: 12px; }
  .dlg .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .check-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); min-height: 48px; }
  .check-row:first-child { border-top: 0; }
  .check-row input { width: 20px; height: 20px; accent-color: var(--blue); flex: none; }
  .song-video { font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-title .by { font-weight: 500; opacity: .85; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  @media (min-width: 700px) { .filters { grid-template-columns: 2fr 2fr 1fr 1fr; } }
  details.panel > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
                            gap: 10px; min-height: 32px; font: 600 1.15rem var(--title); }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::after { content: "▾"; color: var(--muted); font-size: .9rem; }
  details.panel[open] > summary::after { content: "▴"; }
  .badge { margin-left: auto; font: 600 .75rem var(--body); color: #fff; background: var(--red); padding: 2px 8px; border-radius: 10px; }
  .progress-bar { height: 6px; background: var(--empty); border-radius: 3px; overflow: hidden; margin: 12px 0 6px; }
  .progress-bar > i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .3s; }
  h3.sec { font: 600 1.05rem var(--title); margin: 16px 0 6px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .fields .wide { grid-column: 1 / -1; }
  .dup { border-top: 1px solid var(--line); }
  .dup:first-child { border-top: 0; }
  .dup-copies { padding: 0 12px 10px 42px; font-size: .85rem; }
  .dup-copies summary { cursor: pointer; color: var(--blue); font-weight: 600; padding: 2px 0 6px; }
  .radio-row { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; font-size: .9rem; }
  .radio-row input { accent-color: var(--blue); margin-top: 3px; flex: none; }
  ul.songs.flat { border: 0; border-radius: 0; }
  .welcome p { max-width: 520px; margin-left: auto; margin-right: auto; }
  #deckHolder { display: contents; }         /* phones: the deck is pinned at the top */

  /* ── laptop layout: side menu; the player scrolls with the page and becomes a mini-player ── */
  @media (min-width: 900px) {
    body { padding-bottom: 0; padding-left: 96px; }
    nav.tabs { top: 0; bottom: 0; right: auto; width: 96px; flex-direction: column; justify-content: flex-start;
               padding: 20px 0 0; border-top: 0; border-right: 1px solid var(--line); }
    nav.tabs button { flex: none; height: 76px; }
    #deckHolder { display: block; max-width: 900px; margin: 18px auto 0; padding: 0 14px; }
    .deck { position: relative; border-radius: 14px; overflow: hidden; box-shadow: none; padding-top: 0; }
    .deck.mini { position: fixed; top: 16px; right: 16px; width: 380px; z-index: 40; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
    .deck.mini .screen { max-width: none; }
    .deck.mini .now-title { font-size: 1rem; }
    .deck.mini #nowPos, .deck.mini .times .hint { display: none; }
    .toast { bottom: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="deckHolder"><header class="deck" id="deck" hidden>
  <div class="screen"><div id="yt"></div></div>
  <div class="now">
    <div class="now-text"><div class="now-title" id="nowTitle"></div><div class="now-sub" id="nowSub"></div><div class="now-sub" id="nowPos" hidden></div></div>
    <button class="icon-btn" id="btnStop" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
    <button class="icon-btn" id="btnSkip" aria-label="Skip (always counted as a skip)"><svg viewBox="0 0 24 24"><path d="M4 6l8 6-8 6zM12 6l8 6-8 6z" fill="currentColor"/></svg></button>
    <button class="icon-btn primary" id="btnNext" aria-label="Next (played or skipped depending on how much you listened)"><svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6z" fill="currentColor"/><rect x="16" y="6" width="2.5" height="12" rx="1" fill="currentColor"/></svg></button>
  </div>
  <div class="progress"><i id="fill"></i></div>
  <div class="times"><span id="t1">0:00</span><span class="hint" id="hint"></span><span id="t2">–</span></div>
</header></div>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>Player</button>
  <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M4 12h10M4 18h7"/><circle cx="18" cy="17" r="2.5"/><path d="M20.5 17V6.5l-3 1"/></svg>Library</button>
  <button data-tab="playlists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M6 6h12M8 3h8"/></svg>Playlists</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V9"/></svg>Stats</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div id="veil" hidden></div>
<dialog id="dlg" aria-modal="true"></dialog>

<script>
"use strict";
/* ═════════════════════ constants & helpers ═════════════════════ */
const FORMAT = "playlist-manager-sync", VERSION = 1;
const GH_API = new URLSearchParams(location.search).get("github_api") || "https://api.github.com";
const ALL = "★ All songs (most played first)";
const ORDERS = ["In order", "Shuffle", "Shuffle favourites", "Shuffle least played"];
const ORDER_LABEL = { "In order": "In order", "Shuffle": "Shuffle", "Shuffle favourites": "Favourites", "Shuffle least played": "Least played" };
const SKEW = 1.5;   // how strongly "favourites" / "least played" lean (1 = gentle, 2 = strong)
// recency penalty: weight × (1 − e^(−t/τ)), t = time since last played through, τ = forget time / 3
const FORGET_TIMES = { "Off": 0, "12 hours": 12, "1 day": 24, "2 days": 48, "3 days": 72, "1 week": 168, "2 weeks": 336, "1 month": 720 };
const RECENCY_FLOOR = 0.02;
const $ = (id) => document.getElementById(id);

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

    else if (k === "checked") el.checked = !!v;

  return el;
}
const svg = (d) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24");
  s.innerHTML = d; return s; };
const ICON = {
  up: '<path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  down: '<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  x: '<path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
  back: '<path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
};
function fmt(s) {
  if (s == null || !isFinite(s)) return "–";
  s = Math.floor(s); const hh = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (hh ? hh + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
}
function fmtHours(sec) { sec = sec || 0; return sec >= 3600 ? (sec / 3600).toFixed(1) + " h" : Math.round(sec / 60) + " min"; }
const utcNow = () => new Date().toISOString();
function newUid() { const b = new Uint8Array(6); crypto.getRandomValues(b); return [...b].map(x => x.toString(16).padStart(2, "0")).join(""); }
const isPlaceholder = (t) => !t || t.startsWith("YouTube video ");
const watchUrl = (v) => "https://www.youtube.com/watch?v=" + v;
function parseVideoId(t) {
  t = t.trim(); if (/^[A-Za-z0-9_-]{11}$/.test(t)) return t;
  const m = t.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/|\/v\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null;
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, "")); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);

    if (!r.ok) return; const d = await r.json();
    if (d.title && doc.songs[vid] && isPlaceholder(doc.songs[vid].title)) { touchSong(vid, { title: d.title, channel: d.author_name || null }); changed(); }
  } catch (e) { /* blocked by the browser: filled in when played */ }
}
function newPlaylistDialog() {
  const name = h("input", { type: "text", placeholder: "Playlist name", "aria-label": "Playlist name" });
  const create = () => { const n = name.value.trim(); if (!n) return; const uid = newUid();
    doc.playlists[uid] = { name: n, songs: [], created_at: utcNow(), updated_at: utcNow() }; closeDialog(); ui.playlist = uid; changed(); };
  name.addEventListener("keydown", (e) => { if (e.key === "Enter") create(); });
  openDialog(h("h2", {}, "New playlist"), name, h("div", { class: "actions" }, h("button", { class: "btn quiet", onclick: closeDialog }, "Cancel"),
    h("button", { class: "btn primary", onclick: create }, "Create playlist")));
  setTimeout(() => name.focus(), 50);
}
function renameDialog(uid) {
  const p = doc.playlists[uid], name = h("input", { type: "text", value: p.name, "aria-label": "Playlist name" });
  openDialog(h("h2", {}, "Rename playlist"), name, h("div", { class: "actions" }, h("button", { class: "btn quiet", onclick: closeDialog }, "Cancel"),
    h("button", { class: "btn primary", onclick: () => { if (name.value.trim()) { p.name = name.value.trim(); touchPlaylist(uid); closeDialog(); changed(); } } }, "Rename")));
}
function deletePlaylistDialog(uid) {
  const p = doc.playlists[uid];
  openDialog(h("h2", {}, `Delete “${p.name}”?`), h("p", { class: "muted", style: "margin:0" }, "The songs stay in your library, with their play history."),
    h("div", { class: "actions" }, h("button", { class: "btn quiet", onclick: closeDialog }, "Cancel"),
      h("button", { class: "btn danger", onclick: () => { delete doc.playlists[uid]; doc.tombstones["playlist:" + uid] = utcNow(); ui.playlist = null; closeDialog(); changed(); } }, "Delete playlist")));
}
function pickSongsDialog(uid) {
  const isShared = uid === SHARED_ID, chosen = new Set();
  const p = isShared ? { name: sharedName(), songs: sharedList() } : doc.playlists[uid];
  const cands = allSongsOrdered().filter(x => !p.songs.includes(x));
  const list = h("div", { class: "scroll" }), btn = h("button", { class: "btn primary", disabled: true }, "Add songs");
  const search = h("input", { type: "search", placeholder: "Search", "aria-label": "Search songs", oninput: fill });
  function fill() {
    const q = search.value.trim().toLowerCase();
    list.replaceChildren(...cands.filter(x => !q || (doc.songs[x].title + " " + (doc.songs[x].channel || "")).toLowerCase().includes(q)).map(x =>
      h("label", { class: "check-row" }, h("input", { type: "checkbox", checked: chosen.has(x), onchange: (e) => { e.target.checked ? chosen.add(x) : chosen.delete(x);
        btn.disabled = !chosen.size; btn.textContent = chosen.size ? `Add ${chosen.size} songs` : "Add songs"; } }),
        h("span", { class: "grow" }, h("div", { class: "song-title" }, doc.songs[x].title), h("div", { class: "song-sub" }, doc.songs[x].channel || "")))));
    if (!list.children.length) list.append(h("p", { class: "muted", style: "padding:12px" }, cands.length ? "No matches." : "Every song is already in this playlist."));
  }
  btn.onclick = () => {
    if (isShared) { sharedAdd(cands.filter(x => chosen.has(x))); closeDialog(); return; }
    for (const x of cands) if (chosen.has(x)) p.songs.push(x); touchPlaylist(uid); closeDialog(); changed(); };
  openDialog(h("h2", {}, "Add to " + p.name), search, list, h("div", { class: "actions" }, h("button", { class: "btn quiet", onclick: closeDialog }, "Cancel"), btn));
  fill();
}
function eraseDialog() {
  openDialog(h("h2", {}, "Erase data on this phone?"), h("p", { class: "muted", style: "margin:0" }, "Your songs, playlists and history on this phone are deleted. If you use sync, you can get everything back with Sync now."),
    h("div", { class: "actions" }, h("button", { class: "btn quiet", onclick: closeDialog }, "Cancel"),
      h("button", { class: "btn danger", onclick: () => { stopAll(); doc = emptyDoc(); settings.lastSync = null; closeDialog(); changed({ noSync: true }); toast("Erased"); } }, "Erase")));
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify({ ...doc, updated_at: utcNow() })], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: `playlist-backup-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function shareSongs() {
  const songs = {}; for (const [v, s] of Object.entries(doc.songs)) songs[v] = { ...s, details: s.details ? { ...s.details, candidates: [] } : undefined };
  const blob = new Blob([JSON.stringify({ ...emptyDoc(), songs, playlists: doc.playlists, updated_at: utcNow() })], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: `playlist-songs-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("File saved: it has your songs and playlists, without your play history");
}
async function restoreBackup(e) {
  const file = e.target.files[0]; if (!file) return;
  ensurePersist();
  try { const d = JSON.parse(await file.text()); if (d.format !== FORMAT) throw new Error();
    const before = counts(doc); doc = mergeDocs(doc, d); changed(); const after = counts(doc);
    toast(`Restored: ${after.songs - before.songs} new songs, ${after.plays - before.plays} plays`);
  } catch (err) { toast("That file isn't a Playlist Manager backup."); }
  e.target.value = "";
}

/* ═════════════════════ navigation & start ═════════════════════ */
const VIEWS = { player: viewPlayer, library: viewLibrary, playlists: viewPlaylists, stats: viewStats, settings: viewSettings };
function go(tab) {   // tapping the tab you're on goes back to its main list
  if (tab === ui.tab && tab === "playlists") ui.playlist = null;
  ui.tab = tab; render(); window.scrollTo(0, 0);
}
function render() {
  const v = $("view"), focused = document.activeElement, fid = focused && focused.getAttribute("aria-label");
  const sel = focused && focused.selectionStart;
  const next = h("main", { id: "view" }); VIEWS[ui.tab](next); v.replaceWith(next);
  if (fid && focused.tagName === "INPUT" && !$("dlg").open) { const el = next.querySelector(`[aria-label="${CSS.escape(fid)}"]`); if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) {} } }
  for (const b of document.querySelectorAll("nav.tabs button")) b.setAttribute("aria-current", b.dataset.tab === ui.tab ? "page" : "false");
  renderDeck();
}
for (const b of document.querySelectorAll("nav.tabs button")) b.onclick = () => go(b.dataset.tab);

// laptop: when the player is scrolled out of view, it floats as a mini-player in the top-right corner
// (it stays visible, as YouTube requires for a video that starts by itself)
const wide = window.matchMedia("(min-width: 900px)");
let deckMini = false;
function checkDeck() {
  const deck = $("deck"), holder = $("deckHolder");
  let on = deckMini;
  if (!wide.matches || deck.hidden) on = false;
  else if (forceMini) on = true;
  else { const b = holder.getBoundingClientRect().bottom; if (!deckMini && b < 40) on = true; else if (deckMini && b > 120) on = false; }
  if (on === deckMini) return;
  holder.style.minHeight = on ? holder.getBoundingClientRect().height + "px" : "";
  deck.classList.toggle("mini", on); deckMini = on;
  placeDialog();
}
window.addEventListener("scroll", checkDeck, { passive: true });
window.addEventListener("resize", checkDeck);
setInterval(checkDeck, 500);
window.__app = { mergeDocs, sameContent, mergeShared, syncShared, get shared() { return shared; }, get doc() { return doc; }, get Q() { return Q; }, settings: () => settings };

(async () => {
  try { await store.open(); const d = await store.get("doc"), s = await store.get("settings");
    if (d) doc = normalize(d); if (s) settings = { ...settings, ...s, sync: { ...settings.sync, ...(s.sync || {}) }, shared: { ...settings.shared, ...(s.shared || {}) } };
    const sh = await store.get("shared"); if (sh) shared = { ...emptyShared(), ...sh };
  } catch (e) { toast("This browser won't let the app save data: your library won't be kept after closing."); }
  render();
  if (settings.autoSync && syncReady()) syncNow(true);
  if (sharedReady()) syncShared(true);
})();
</script>
